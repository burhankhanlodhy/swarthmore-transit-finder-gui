app = "transit-finder"          # change to your chosen app name
primary_region = "iad"          # closest region: iad=US-East, ord=US-Central, lax=US-West

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
